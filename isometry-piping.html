<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>איזומטריה – צנרת "2 לעמדת תדלוק (לפי מידות)</title>
<style>
  :root{
    --bg1:#eef3f8; --bg2:#dbe6f0; --ink:#1f2d3d; --muted:#5b6b7b;
    --card:#ffffff; --line:#c9d6e3; --dim:#1f3550;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;
    color:var(--ink);
    background:radial-gradient(circle at 30% 0%,var(--bg1),var(--bg2));
    display:flex;flex-direction:column;align-items:center;min-height:100%;
  }
  header{width:100%;max-width:1100px;padding:22px 26px 6px}
  header h1{margin:0;font-size:22px;letter-spacing:.2px}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  .stage{width:100%;max-width:1100px;flex:1;padding:10px 16px 24px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 18px 50px rgba(31,45,61,.12);overflow:hidden;
  }
  svg{display:block;width:100%;height:auto}
  .legend{
    display:flex;gap:18px;flex-wrap:wrap;align-items:center;
    padding:12px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);
  }
  .legend span{display:inline-flex;align-items:center;gap:8px}
  .swatch{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
  .iso-label{font-size:13px;font-weight:600;fill:var(--ink)}
  .iso-sub{font-size:11px;fill:var(--muted)}
  .iso-dim{font-size:13px;font-weight:700;fill:var(--dim);
    paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  .leader{stroke:#7d8b99;stroke-width:1;stroke-dasharray:3 3;fill:none}
  .leader-dot{fill:#7d8b99}
  .grid-line{stroke:#bcd0e2;stroke-width:1}
  .dim-line{stroke:var(--dim);stroke-width:1.2;fill:none}
  .dim-wit{stroke:var(--dim);stroke-width:0.9;fill:none;opacity:.7}
</style>
</head>
<body>
  <header>
    <h1>איזומטריה – קו צנרת פלדה "2 (DN50)</h1>
    <p>קו תלוי לפי מידות: ריצה אופקית 5.00 מ' בגובה 4.00 מ', ירידה בריזר אנכי אל חיבור בגובה 1.50 מ' בעמדת התדלוק.</p>
  </header>

  <div class="stage">
    <div class="card">
      <svg id="scene" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-label="איור איזומטרי ממודד של צנרת 2 צול היורדת לעמדת תדלוק"></svg>
      <div class="legend">
        <span><i class="swatch" style="background:#5a8fbf"></i> צנרת פלדה "2 (DN50)</span>
        <span><i class="swatch" style="background:#c0392b"></i> עמדת תדלוק</span>
        <span><i class="swatch" style="background:#8a939c"></i> מתלים וקורת תמיכה</span>
        <span><i class="swatch" style="background:#e0b13a"></i> ברז שער</span>
        <span>📐 קווי מידה במטרים &nbsp;·&nbsp; משבצת רשת = 1.00 מ'</span>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ===== Isometric projection (1 scene unit = 1 metre) ===================
  const ISO = { cos: Math.cos(Math.PI / 6), sin: Math.sin(Math.PI / 6), scale: 42 };
  const project = (x, y, z) => ({
    x: (x - y) * ISO.cos * ISO.scale,
    y: ((x + y) * ISO.sin - z) * ISO.scale
  });
  const shade = (hex, f) => {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
    const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
    const b = Math.min(255, Math.round((n & 255) * f));
    return `rgb(${r},${g},${b})`;
  };

  const SVGNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("scene");
  const bounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
  const track = p => {
    if (p.x < bounds.minX) bounds.minX = p.x;
    if (p.y < bounds.minY) bounds.minY = p.y;
    if (p.x > bounds.maxX) bounds.maxX = p.x;
    if (p.y > bounds.maxY) bounds.maxY = p.y;
  };

  // ===== Real dimensions (metres) ========================================
  const RUN   = 5.0;   // horizontal suspended run length
  const H_SUS = 4.0;   // suspension height: floor -> top pipe centreline
  const H_CON = 1.5;   // connection height at dispenser (riser bottom)
  const X0 = 0.6, YC = 2.0;            // run start x, pipe depth (y)
  const X1 = X0 + RUN;                 // run end x (riser location)

  // ===== Scene boxes =====================================================
  const boxes = [];
  const addBox = (x, y, z, sx, sy, sz, color, stroke = "rgba(0,0,0,0.18)") => {
    const X = x + sx, Y = y + sy, Z = z + sz;
    const P = (a, b, c) => { const p = project(a, b, c); track(p); return p; };
    const top   = [P(x, y, Z), P(X, y, Z), P(X, Y, Z), P(x, Y, Z)];
    const right = [P(X, y, z), P(X, Y, z), P(X, Y, Z), P(X, y, Z)];
    const left  = [P(x, Y, z), P(X, Y, z), P(X, Y, Z), P(x, Y, Z)];
    boxes.push({
      depth: (x + sx/2) + (y + sy/2) + (z + sz/2),
      faces: [
        { pts: left,  fill: shade(color, 0.60) },
        { pts: right, fill: shade(color, 0.78) },
        { pts: top,   fill: shade(color, 1.00) }
      ],
      stroke
    });
  };

  const W = 0.28;                       // symbolic pipe thickness (not to scale)
  const STEEL = "#5a8fbf";
  const pipeX = (xa, xb, yc, zc) => addBox(xa, yc - W/2, zc - W/2, xb - xa, W, W, STEEL);
  const pipeZ = (za, zb, xc, yc) => addBox(xc - W/2, yc - W/2, za, W, W, zb - za, STEEL);

  // ----- Floor grid (1 m squares) -----
  const FX = 7, FY = 4;
  const gfrag = [];
  const floor = [project(0,0,0), project(FX,0,0), project(FX,FY,0), project(0,FY,0)];
  floor.forEach(track);
  gfrag.push(`<polygon points="${floor.map(p=>`${p.x},${p.y}`).join(" ")}" fill="#eaf1f8"/>`);
  for (let gx = 0; gx <= FX; gx++){ const a=project(gx,0,0),b=project(gx,FY,0);track(a);track(b);
    gfrag.push(`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="grid-line"/>`); }
  for (let gy = 0; gy <= FY; gy++){ const a=project(0,gy,0),b=project(FX,gy,0);track(a);track(b);
    gfrag.push(`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="grid-line"/>`); }

  // ----- Support beam + hangers -----
  addBox(X0 - 0.3, YC - 0.18, H_SUS + 0.6, RUN + 0.6, 0.36, 0.34, "#8a939c");  // beam
  const beamTopZ = H_SUS + 0.6;
  [1.5, 3.0, 4.5].forEach(d => {
    const hx = X0 + d;
    addBox(hx - 0.05, YC - 0.05, H_SUS, 0.10, 0.10, beamTopZ - H_SUS, "#9aa3ac");
  });

  // ----- Dispenser (fuelling station), top at connection height -----
  const DISP = "#c0392b";
  (() => { const s = project(X1, YC, 0);
    gfrag.push(`<ellipse cx="${s.x}" cy="${s.y+6}" rx="48" ry="20" fill="rgba(31,45,61,0.16)"/>`); })();
  addBox(X1 - 0.85, YC - 0.85, 0.0,   1.7, 1.7, H_CON,  DISP);          // body (top = 1.5 m)
  addBox(X1 - 0.7,  YC - 0.7,  H_CON, 1.4, 1.4, 0.45,  "#2c3e50");      // head
  addBox(X1 - 0.45, YC - 0.4,  H_CON+0.08, 0.9, 0.8, 0.28, "#67c0e8");  // screen
  addBox(X1 - 1.0,  YC - 0.3,  0.7,   0.18, 0.6, 0.55, "#2c3e50");      // holster

  // ----- Pipe run + elbow + riser -----
  pipeX(X0, X1 + W/2, YC, H_SUS);          // horizontal run (5 m)
  pipeZ(H_CON, H_SUS + W/2, X1, YC);       // riser down to connection (1.5 m)
  addBox(X1 - 0.30, YC - 0.30, H_CON - 0.05, 0.60, 0.60, 0.16, "#3f6f96"); // flange

  // ----- Gate valve on the riser -----
  const vz = (H_CON + H_SUS) / 2 - 0.3;
  addBox(X1 - 0.30, YC - 0.30, vz, 0.60, 0.60, 0.6, "#e0b13a");

  // ===== Render solids (painter's algorithm) =============================
  boxes.sort((a, b) => a.depth - b.depth);
  const frag = [...gfrag];
  for (const box of boxes)
    for (const f of box.faces)
      frag.push(`<polygon points="${f.pts.map(p=>`${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(" ")}" `
        + `fill="${f.fill}" stroke="${box.stroke}" stroke-width="0.8" stroke-linejoin="round"/>`);

  // valve handwheel
  (() => { const c = project(X1, YC, vz + 0.6);
    frag.push(`<ellipse cx="${c.x}" cy="${c.y}" rx="13" ry="6.5" fill="none" stroke="#7a5b12" stroke-width="3"/>`);
    frag.push(`<ellipse cx="${c.x}" cy="${c.y}" rx="5" ry="2.6" fill="#7a5b12"/>`); })();

  // fuel hose
  (() => {
    const a = project(X1 - 1.0, YC, 1.2), b = project(X1 - 1.7, YC + 0.5, 0.05);
    track(a); track(b);
    frag.push(`<path d="M ${a.x} ${a.y} Q ${a.x-30} ${(a.y+b.y)/2+24} ${b.x} ${b.y}" fill="none" stroke="#2c3e50" stroke-width="4.5" stroke-linecap="round"/>`);
    frag.push(`<circle cx="${b.x}" cy="${b.y}" r="4" fill="#1c2733"/>`);
  })();

  // ===== Dimension lines (isometric, in metres) ==========================
  const dimFrag = [];
  const arrow = (tip, toward) => {                       // small filled triangle
    const dx = toward.x - tip.x, dy = toward.y - tip.y;
    const len = Math.hypot(dx, dy) || 1, ux = dx/len, uy = dy/len, s = 8;
    const bx = tip.x + ux*s, by = tip.y + uy*s, px = -uy*3.4, py = ux*3.4;
    return `<polygon points="${tip.x.toFixed(1)},${tip.y.toFixed(1)} ${(bx+px).toFixed(1)},${(by+py).toFixed(1)} ${(bx-px).toFixed(1)},${(by-py).toFixed(1)}" fill="var(--dim)"/>`;
  };
  // A,B = 3D measured endpoints; off = 3D offset of the dim line; tdx/tdy = text nudge (px)
  const isoDim = (A, B, off, text, tdx, tdy) => {
    const a = project(A[0], A[1], A[2]), b = project(B[0], B[1], B[2]);
    const a2 = project(A[0]+off[0], A[1]+off[1], A[2]+off[2]);
    const b2 = project(B[0]+off[0], B[1]+off[1], B[2]+off[2]);
    [a, b, a2, b2].forEach(track);
    dimFrag.push(`<line x1="${a.x}" y1="${a.y}" x2="${a2.x}" y2="${a2.y}" class="dim-wit"/>`);
    dimFrag.push(`<line x1="${b.x}" y1="${b.y}" x2="${b2.x}" y2="${b2.y}" class="dim-wit"/>`);
    dimFrag.push(`<line x1="${a2.x}" y1="${a2.y}" x2="${b2.x}" y2="${b2.y}" class="dim-line"/>`);
    dimFrag.push(arrow(a2, b2));
    dimFrag.push(arrow(b2, a2));
    const mx = (a2.x + b2.x)/2 + (tdx||0), my = (a2.y + b2.y)/2 + (tdy||0);
    track({x:mx-26,y:my-12}); track({x:mx+26,y:my+4});
    dimFrag.push(`<text x="${mx.toFixed(1)}" y="${my.toFixed(1)}" text-anchor="middle" class="iso-dim">${text}</text>`);
  };

  // run length (offset upward, above the beam)
  isoDim([X0, YC, H_SUS], [X1, YC, H_SUS], [0, 0, 1.7], "5.00 מ'", 0, -6);
  // suspension height (offset to -x at the start)
  isoDim([X0, YC, 0], [X0, YC, H_SUS], [-1.4, 0, 0], "4.00 מ'", -10, 0);
  // riser drop (offset to +y)
  isoDim([X1, YC, H_CON], [X1, YC, H_SUS], [0, 1.6, 0], "2.50 מ'", 18, 4);
  // connection height (offset to +x at the dispenser)
  isoDim([X1, YC, 0], [X1, YC, H_CON], [1.5, 0, 0], "1.50 מ'", 14, 4);

  // ===== Part labels =====================================================
  const labels = [
    { p: project((X0+X1)/2, YC, H_SUS + W/2), dx: 0,  dy: -58, t: 'צנרת פלדה "2', s: "DN50 · קו תלוי" },
    { p: project(X1, YC, vz + 0.3),            dx: -74, dy: -8, t: "ברז שער", s: "ניתוק / בקרה" },
    { p: project(X1, YC, H_CON + 0.45),        dx: 6,  dy: 70,  t: "עמדת תדלוק", s: "חיבור הזנה 1.5 מ'" }
  ];
  const labelFrag = [];
  for (const L of labels) {
    const tx = L.p.x + L.dx, ty = L.p.y + L.dy;
    track({x:tx-46,y:ty-16}); track({x:tx+46,y:ty+8});
    labelFrag.push(`<circle cx="${L.p.x.toFixed(1)}" cy="${L.p.y.toFixed(1)}" r="2.5" class="leader-dot"/>`);
    labelFrag.push(`<path d="M ${L.p.x.toFixed(1)} ${L.p.y.toFixed(1)} L ${tx.toFixed(1)} ${ty.toFixed(1)}" class="leader"/>`);
    labelFrag.push(`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" class="iso-label">${L.t}</text>`);
    labelFrag.push(`<text x="${tx.toFixed(1)}" y="${(ty+15).toFixed(1)}" text-anchor="middle" class="iso-sub">${L.s}</text>`);
  }

  // ===== Compose & size =================================================
  const pad = 60;
  svg.setAttribute("viewBox",
    `${(bounds.minX-pad).toFixed(1)} ${(bounds.minY-pad).toFixed(1)} `
    + `${(bounds.maxX-bounds.minX+pad*2).toFixed(1)} ${(bounds.maxY-bounds.minY+pad*2).toFixed(1)}`);

  const g = document.createElementNS(SVGNS, "g"); g.innerHTML = frag.join("");      svg.appendChild(g);
  const d = document.createElementNS(SVGNS, "g"); d.innerHTML = dimFrag.join("");   svg.appendChild(d);
  const l = document.createElementNS(SVGNS, "g"); l.innerHTML = labelFrag.join(""); svg.appendChild(l);
})();
</script>
</body>
</html>
